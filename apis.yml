aid: continual
name: Continual
description: >-
  Continual was an operational-AI / MLOps platform for the modern data stack, founded
  by Tristan Zajonc (previously Sense, acquired by Cloudera) and Tyler Kohn
  (co-founder of RichRelevance). It let data and analytics teams declaratively build,
  deploy, and continuously maintain production predictive models directly inside
  cloud data warehouses — Snowflake, Databricks, and BigQuery — using SQL and dbt as
  the primary interface rather than bespoke ML pipelines. The company raised a seed
  round led by Amplify Partners and a $14.5M Series A in 2022. The product is now
  dormant: continual.ai is a parked single-page shell, the documentation host
  redirects to the homepage, and the last release of the first-party Python CLI + SDK
  on PyPI was in March 2023. This profile captures the verifiable public artifacts
  that remain — the PyPI package, the GitHub organization, and a live domain-security
  posture.
